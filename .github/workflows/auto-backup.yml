name: Auto Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backup API
        run: |
          curl -X GET "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/backup?encryptOnly=true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail
