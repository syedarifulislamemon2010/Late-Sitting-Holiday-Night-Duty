name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 SHA pinned

    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0 SHA pinned
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies strictly
      run: npm ci --ignore-scripts

    - name: Run verification pipeline (typecheck, lint, test, build)
      run: npm run verify
      env:
        DATABASE_URL: "postgres://postgres:postgres@localhost:5432/lhn_portal_build"
        NEXTAUTH_SECRET: "ci-build-temporary-nextauth-secret-key-2026"
        NEXTAUTH_URL: "http://localhost:3000"

    - name: Enforce production security audit (zero high/critical)
      run: npm audit --omit=dev --audit-level=high
