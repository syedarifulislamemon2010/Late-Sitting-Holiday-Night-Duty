name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check
      run: npx tsc --noEmit
      
    - name: Run unit & integration tests
      run: npx vitest run
      
    - name: Build Next.js
      run: npm run build
      env:
        DATABASE_URL: "postgres://postgres:postgres@localhost:5432/lhn_portal_build"
        NEXTAUTH_SECRET: "ci-build-temporary-nextauth-secret-key-2026"
        NEXTAUTH_URL: "http://localhost:3000"
        NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
