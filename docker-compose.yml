version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lhn-portal-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: db_secure_password_123
      POSTGRES_DB: lhn_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lhn-portal-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:db_secure_password_123@db:5432/lhn_portal?sslmode=disable
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev_nextauth_secret_janata_bank_lhn_portal_key
      GEMINI_API_KEY: ""
      NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock"
    depends_on:
      - db

volumes:
  pgdata:
