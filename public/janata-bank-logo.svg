<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- JB Logo Mark -->
  <g transform="translate(5, 5)">
    <!-- Outer rounded square -->
    <rect x="0" y="0" width="50" height="50" rx="8" fill="none" stroke="#00BCD4" stroke-width="3"/>
    <!-- J letter stylized with wave lines -->
    <path d="M12 12 Q12 38, 25 38 Q38 38, 38 12" fill="none" stroke="#00BCD4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 18 Q8 40, 25 42 Q42 40, 42 18" fill="none" stroke="#00BCD4" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 15 Q14 35, 25 35 Q36 35, 36 15" fill="none" stroke="#00BCD4" stroke-width="2" stroke-linecap="round"/>
    <!-- B shape integrated -->
    <line x1="25" y1="10" x2="25" y2="42" stroke="#00BCD4" stroke-width="2.5"/>
    <path d="M25 10 Q38 10, 38 18 Q38 25, 25 25" fill="none" stroke="#00BCD4" stroke-width="2.5"/>
    <path d="M25 25 Q40 25, 40 33 Q40 42, 25 42" fill="none" stroke="#00BCD4" stroke-width="2.5"/>
  </g>
  <!-- Bank Name -->
  <text x="65" y="28" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#00BCD4">Janata Bank PLC.</text>
  <text x="65" y="45" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#00838F" letter-spacing="0.5">your committed partner in progress</text>
</svg>
