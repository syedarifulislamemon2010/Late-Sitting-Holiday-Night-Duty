# Janata Bank LHN Portal - Nginx Reverse Proxy Configuration for Sub-URL (/lhn)
# Copy this block into /etc/nginx/sites-available/default or nginx.conf on 172.18.18.64

server {
    listen 80;
    server_name 172.18.18.64;

    # Sub-URL configuration: http://172.18.18.64/lhn
    location /lhn {
        proxy_pass http://127.0.0.1:3000/lhn;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other apps can use other locations on the same IP:
    # location /other-app {
    #     proxy_pass http://127.0.0.1:4000;
    # }
}
