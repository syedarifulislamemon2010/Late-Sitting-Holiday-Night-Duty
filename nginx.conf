# Janata Bank LHN Portal - Nginx Sub-URL Setup Guide (/lhn)
# Replace /etc/nginx/sites-available/default on server 172.18.18.64 with this configuration:
#
# IMPORTANT ARCHITECTURE NOTE:
# The Next.js banking portal runs on port 3000.
# In this intranet setup, requests under `/lhn` are reverse-proxied to `http://127.0.0.1:3000/lhn`.
#
# Notice on TRUST_PROXY_HEADERS:
# In the application's environment (.env), ensure `TRUST_PROXY_HEADERS=true` is set when running
# behind nginx so the Next.js app securely trusts X-Real-IP and X-Forwarded-For headers from this proxy.

server {
    listen 80;
    server_name 172.18.18.64;

    # 1. ONLY forward requests under /lhn to Janata Bank LHN Portal (Port 3000)
    location /lhn {
        proxy_pass http://127.0.0.1:3000/lhn;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. DO NOT proxy location / to port 3000.
    # Leave root / for main server index or other intranet apps:
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}

